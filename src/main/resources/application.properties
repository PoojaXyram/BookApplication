##DB congigurations
spring.application.name=BookApplication
spring.datasource.url=jdbc:postgresql://localhost:5432/BookApplication
spring.datasource.username=postgres
spring.datasource.password=root

##Hibernate config
#Automatically update or create DB schema
spring.jpa.hibernate.ddl-auto=update
#To translate HQL to SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Show SQL queries in the console
spring.jpa.show-sql=true

#SQL statements are printed in a readable, indented format
spring.jpa.properties.hibernate.format_sql=false





